name: Release

# Cutting a release (maintainers):
#   1. Bump `version` in pyproject.toml (PEP 440, e.g. 1.1.0b1 or 1.1.0).
#   2. Merge that to main.
#   3. Tag it and push:  git tag v1.1.0 && git push origin v1.1.0
# Pushing the `v<version>` tag runs this workflow: it builds the sdist +
# wheel once, publishes them as a GitHub Release, and uploads them to PyPI.
# The tag must match the pyproject version, or the run fails.
#
# PyPI is published to with Trusted Publishing (OpenID Connect): no token is
# stored. PyPI trusts this repository's `release.yml` in the `pypi`
# environment; the `testpypi` environment the same for test.pypi.org.
#
# A dry run: run this workflow by hand (Actions > Release > Run workflow). It
# builds and uploads to TestPyPI only -- no GitHub Release, nothing on PyPI.
# TestPyPI, like PyPI, takes each version once.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the pyproject version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=v$tag  pyproject=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match pyproject version $ver — bump pyproject.toml first"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import wfpy; print('import OK:', wfpy.__doc__.splitlines()[0])"
          /tmp/smoke/bin/wfpy --help > /dev/null && echo "CLI OK"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mark PEP 440 pre-releases (a/b/rc) as GitHub pre-releases.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *a* | *b* | *rc*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease

  pypi:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wfpy/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/wfpy/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
